name = "blind_prf"
version = "0.1.0"
defaultTargets = ["BlindPRF"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "BlindPRF"

# `lake build Audit` fails unless every BlindPRF declaration uses only Lean's standard axioms.
[[lean_lib]]
name = "Audit"
